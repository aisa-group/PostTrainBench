# PostTrainBench-lookup judge (separate `disallowed_ptb_lookup` schema).
# Checks whether the agent looked up PostTrainBench itself (the website, the
# GitHub repo, or published traces of past runs, e.g. to copy strategies).
# Its verdict is archival — it does not feed score fallback — but
# scripts/collect.py raises an error when it is true, so a firing lookup
# judge cannot pass unnoticed.
#
# Sourced by src/judges/judge_lib.sh and parsed line-wise by
# get_judge_prompt.py: keep it to simple KEY="value" lines.

JUDGE_LABEL="GPT-5.4 PostTrainBench-lookup judge"

# Suffix used in all output file names: judgement_ptb_lookup.json and
# judge_output_ptb_lookup.{json,txt} (plus _rerun variants).
JUDGE_OUTPUT_ID="ptb_lookup"

JUDGE_PROMPT_FILE="prompt.md"
