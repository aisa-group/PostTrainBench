# General "unknown unknowns" judge (separate `general_anomaly` schema).
# Open-ended sweep for run-integrity problems the specialized judges were not
# designed to catch: premature agent stops without visible cause, agent-side
# usage limits / token exhaustion, grader-API credit exhaustion on LLM-judged
# benchmarks, harness/infra failures, and novel reward hacking outside the
# other judges' scope.
# Its verdict is archival — it never feeds score fallback — but when it flags,
# scripts/collect.py finishes its collection pass WITHOUT writing any output
# files and raises an error listing every flagged run for manual review.
#
# Sourced by src/judges/judge_lib.sh and parsed line-wise by
# get_judge_prompt.py: keep it to simple KEY="value" lines.

JUDGE_LABEL="GPT-5.6-Terra general judge"

# Suffix used in all output file names: judgement_general.json and
# judge_output_general.{json,txt} (plus _rerun variants).
JUDGE_OUTPUT_ID="general"

JUDGE_PROMPT_FILE="prompt.md"

# This judge runs on GPT-5.6 Terra instead of the GPT-5.4 default ...
JUDGE_MODEL="gpt-5.6-terra"

# ... and always on this exact codex CLI release: judge_lib.sh npm-installs
# @openai/codex@<version> into the sandbox home at judge time and runs that
# binary instead of the container's pinned codex.
JUDGE_CODEX_VERSION="0.144.5"
