# Derived-contamination-only judge (testing / diagnostic).
#
# Flags ONLY the subtle contamination form: training data derived from
# specific benchmark test items (paraphrasing, perturbation, seeded
# generation, hand-written coverage) WITHOUT the test data itself being
# trained on. Direct contamination (training on actual test data) and clean
# runs both yield false.
#
# Deliberately NOT in ALL_JUDGES (judge_lib.sh): it never runs inline in
# run_task.sh and is excluded from default rerun batches, and its verdict
# (judgement_derived_contamination[_rerun].json) is not read by
# scripts/collect.py or any aggregation. Run it explicitly:
#   bash src/judges/run_judges.sh --judges derived_contamination_judge <result_dir>
#   bash src/judges/rerun/rerun_judge.sh --judge derived_contamination_judge <dirs...>
# Review flags: python scripts/find_flagged_runs.py --judge derived_contamination_judge
#
# Sourced by src/judges/judge_lib.sh and parsed line-wise by
# get_judge_prompt.py: keep it to simple KEY="value" lines.

JUDGE_LABEL="GPT-5.6-Terra derived-contamination-only judge"

JUDGE_OUTPUT_ID="derived_contamination"

JUDGE_PROMPT_FILE="prompt.md"

# Runs on GPT-5.6 Terra instead of the GPT-5.4 default (like general_judge) ...
JUDGE_MODEL="gpt-5.6-terra"

# ... which requires this exact codex CLI release: judge_lib.sh npm-installs
# @openai/codex@<version> into the sandbox home at judge time and runs that
# binary instead of the container's pinned codex.
JUDGE_CODEX_VERSION="0.144.5"
