# Data-contamination / disallowed-base-model judge.
#
# Sourced by src/judges/judge_lib.sh and parsed line-wise by
# get_judge_prompt.py: keep it to simple KEY="value" lines.

JUDGE_LABEL="GPT-5.4 contamination/base-model judge"

# Suffix used in all output file names: judgement_gpt5_4.json and
# judge_output_gpt5_4.{json,txt} (plus _rerun variants). Kept as "gpt5_4" so
# existing result directories and downstream consumers keep working.
JUDGE_OUTPUT_ID="gpt5_4"

JUDGE_PROMPT_FILE="prompt.md"

# Historical run_task.sh behavior: if this judge fails to produce
# judgement.json during the initial run, the task run continues (the verdict
# can still be produced later by the rerun pipeline). Standalone runs via
# run_judges.sh always treat a missing judgement as fatal.
JUDGE_MISSING_JUDGEMENT_FATAL_INLINE=0

# HTCondor concurrency-limit units a rerun job of this judge consumes
# (concurrency_limits = user.judge:<weight> in rerun_judges.sub); a job that
# runs several judges consumes the max across them.
JUDGE_CONDOR_WEIGHT=400
