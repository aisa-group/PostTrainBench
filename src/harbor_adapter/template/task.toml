version = "1.0"

[metadata]
author_name = "PostTrainBench Team"
category = "ml-training"
tags = ["post-training", "llm", "fine-tuning", "gpu"]

[environment]
gpus = 1
gpu_types = ["H100"]
cpus = 8
memory_mb = 65536
storage_mb = 102400
build_timeout_sec = 3600.0
allow_internet = true

# Healthcheck runs after entrypoint.sh comes up and before the agent starts.
# Two jobs:
#   1. Verify the log-streaming daemon (tail -F /logs/agent/*) is running so
#      the agent's output reaches Modal's dashboard live.
#   2. Idempotently record the timer start time at /timer_start. Aligning the
#      write with healthcheck means the timer starts essentially at agent
#      launch, not at container boot.
[environment.healthcheck]
command = "pgrep -f 'tail -F' > /dev/null && (test -f /timer_start || date +%s > /timer_start)"
interval_sec = 2
timeout_sec = 5
start_period_sec = 5
start_interval_sec = 1
retries = 3

# Verifier runs in a SEPARATE container from the agent — harbor 0.7.0's
# separate-verifier mode (PR #1655, docs:
# https://www.harborframework.com/docs/tasks#verifier-environment-shared-vs-separate).
# Adversarial agent can't tamper with evaluate.py, the contamination
# judge, the Python interpreter, or any installed package the verifier
# imports. Mirrors the condor pipeline's vllm_debug.sif (separate
# container for evaluation).
#
# The verifier image is built from `tests/` as the build context (see
# tests/Dockerfile). test.sh + evaluate.py + templates/ +
# contamination_judge.py + metadata.json are baked INTO the image at
# build time; harbor does not upload tests/ at runtime for separate envs.
[verifier]
timeout_sec = 10800.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
CODEX_API_KEY = "${OPENAI_API_KEY}"

# Verifier container resources. Same as agent env so vllm + flash-attn
# behave the same (model loading, batch sizes, etc.).
[verifier.environment]
gpus = 1
gpu_types = ["H100"]
cpus = 8
memory_mb = 65536
storage_mb = 102400
build_timeout_sec = 3600.0
allow_internet = true

[verifier.environment.healthcheck]
command = "pgrep -f 'tail -F' > /dev/null && (test -f /timer_start || date +%s > /timer_start)"
interval_sec = 2
timeout_sec = 5
start_period_sec = 5
start_interval_sec = 1
retries = 3

[agent]
timeout_sec = 36000.0

# Single workspace artifact. In separate-verifier mode this `source`
# is transferred from the agent env to the verifier env at the same
# path AND archived under <trial_dir>/artifacts/workspace/ on the host.
#
# One entry (was previously two — workspace + a separate final_model).
# Rationale for collapsing:
#   1. Two overlapping artifacts (final_model nested inside workspace)
#      triggered harbor 0.15's UserWarning at task load and made
#      upload order load-bearing (`upload_artifacts` calls
#      `empty_dirs(target)` before each upload, so a later workspace
#      upload would wipe an earlier final_model).
#   2. Two tar ops on the agent env is two chances to hit harbor's
#      flaky transfer path (empty stderr, code -1). One op is
#      strictly better.
#
# `final_model` is NOT in the exclude list — we want the trained
# weights carried in via this single artifact so the verifier has them
# at /home/agent/workspace/final_model/. On the host they land at
# artifacts/workspace/final_model/ (postmortem access, just one path
# deeper than before).
#
# The contamination judge in test.sh reads the agent's code via
# `cd $WORKSPACE && codex exec ...` — the workspace transfer supplies
# everything under /home/agent/workspace/ minus the excludes below.
[[artifacts]]
source = "/home/agent/workspace"
destination = "workspace"
# Aggressive excludes to keep the agent-side tar tractable. The
# 2026-05-27 and 2026-06-27 trials died with harbor's tar exit code
# -1 / empty stderr on multi-GB workspaces containing HF cache +
# wandb + checkpoint dirs. Drop anything the contamination judge
# doesn't need — judge only reads the agent's source code (.py, .md,
# .json configs, .sh), not caches/checkpoints/logs. `final_model` is
# deliberately kept so the verifier gets the weights.
exclude = [
    # Standard hygiene:
    "__pycache__",
    "*.pyc",
    ".git",
    ".venv",
    "venv",
    # HF / transformers / datasets caches (often many GB):
    ".cache",
    ".huggingface",
    # Experiment tracking:
    "wandb",
    ".wandb",
    # Training output dirs commonly produced by HF Trainer / Hydra
    # (final_model is NOT excluded — we want it transferred):
    "checkpoint-*",
    "runs",
    "outputs",
    "output",
    "logs",
    # Tokenized dataset shards (large, not useful for judge):
    "*.arrow",
    "*.parquet",
    # Misc:
    "tmp",
    ".tmp",
]
