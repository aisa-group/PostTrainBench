version = "1.0"

[metadata]
author_name = "PostTrainBench Team"
category = "ml-training"
tags = ["post-training", "llm", "fine-tuning", "gpu"]

[environment]
gpus = 1
gpu_types = ["H100"]
cpus = 8
memory_mb = 65536
storage_mb = 102400
build_timeout_sec = 3600.0
allow_internet = true

# Healthcheck runs after entrypoint.sh comes up and before the agent starts.
# Two jobs:
#   1. Verify the log-streaming daemon (tail -F /logs/agent/*) is running so
#      the agent's output reaches Modal's dashboard live.
#   2. Idempotently record the timer start time at /timer_start. Aligning the
#      write with healthcheck means the timer starts essentially at agent
#      launch, not at container boot.
[environment.healthcheck]
command = "pgrep -f 'tail -F' > /dev/null && (test -f /timer_start || date +%s > /timer_start)"
interval_sec = 2
timeout_sec = 5
start_period_sec = 5
start_interval_sec = 1
retries = 3

# The agent's final_model directory is a harbor task-declared shared volume
# ([[environment.volumes]]). The trained weights land directly on a
# provider-managed persistent volume (Modal Volume on modal, named volume on
# docker), and the separate verifier below attaches the SAME per-trial volume
# read-only — the multi-GB weights never ride the tar/host artifact path that
# previously died with exit code -1 on large workspaces.
[[environment.volumes]]
name = "model"
path = "/home/agent/workspace/final_model"

# Verifier runs in a SEPARATE container from the agent — harbor 0.7.0's
# separate-verifier mode (PR #1655, docs:
# https://www.harborframework.com/docs/tasks#verifier-environment-shared-vs-separate).
# Adversarial agent can't tamper with evaluate.py, the contamination
# judge, the Python interpreter, or any installed package the verifier
# imports. Mirrors the condor pipeline's vllm_debug.sif (separate
# container for evaluation).
#
# The verifier image is built from `tests/` as the build context (see
# tests/Dockerfile). test.sh + evaluate.py + templates/ +
# contamination_judge.py + metadata.json are baked INTO the image at
# build time; harbor does not upload tests/ at runtime for separate envs.
[verifier]
timeout_sec = 10800.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
CODEX_API_KEY = "${OPENAI_API_KEY}"

# Verifier container resources. Same as agent env so vllm + flash-attn
# behave the same (model loading, batch sizes, etc.).
[verifier.environment]
gpus = 1
gpu_types = ["H100"]
cpus = 8
memory_mb = 65536
storage_mb = 102400
build_timeout_sec = 3600.0
allow_internet = true

[verifier.environment.healthcheck]
command = "pgrep -f 'tail -F' > /dev/null && (test -f /timer_start || date +%s > /timer_start)"
interval_sec = 2
timeout_sec = 5
start_period_sec = 5
start_interval_sec = 1
retries = 3

# Same logical volume as the agent's final_model (same `name` = same
# underlying per-trial volume), mounted READ-ONLY so the verification phase
# cannot modify the evidence it grades. test.sh evaluates /mnt/model.
[[verifier.environment.volumes]]
name = "model"
path = "/mnt/model"
read_only = true

[agent]
timeout_sec = 36000.0

# Single workspace artifact. In separate-verifier mode this `source`
# is transferred from the agent env to the verifier env at the same
# path AND archived under <trial_dir>/artifacts/workspace/ on the host.
#
# This transfer now carries ONLY the contamination-judge inputs (the
# agent's source code: .py, .md, .json configs, .sh). The trained
# weights travel on the `model` shared volume declared above — they are
# no longer part of this tar, which keeps the agent-side tar small and
# avoids the flaky multi-GB transfer path (empty stderr, code -1) that
# killed the 2026-05-27 and 2026-06-27 trials.
#
# The contamination judge in test.sh reads the agent's code via
# `cd $WORKSPACE && codex exec ...` — the workspace transfer supplies
# everything under /home/agent/workspace/ minus the excludes below.
[[artifacts]]
source = "/home/agent/workspace"
destination = "workspace"
exclude = [
    # The trained model arrives via the shared volume, not this tar.
    # (final_model is a volume mountpoint in the agent container; tarring
    # it would re-introduce the multi-GB transfer this PR removes.)
    "final_model",
    # Standard hygiene:
    "__pycache__",
    "*.pyc",
    ".git",
    ".venv",
    "venv",
    # HF / transformers / datasets caches (often many GB):
    ".cache",
    ".huggingface",
    # Experiment tracking:
    "wandb",
    ".wandb",
    # Training output dirs commonly produced by HF Trainer / Hydra:
    "checkpoint-*",
    "runs",
    "outputs",
    "output",
    "logs",
    # Stray weight files outside final_model (large, not useful for judge):
    "*.safetensors",
    "*.pt",
    "*.pth",
    "*.ckpt",
    "*.gguf",
    # Tokenized dataset shards (large, not useful for judge):
    "*.arrow",
    "*.parquet",
    # Misc:
    "tmp",
    ".tmp",
]
